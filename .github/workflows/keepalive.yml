# Supabase bepul loyihasi 7 kun ishlatilmasa "uxlab qoladi" (Paused).
# Bu ish har kuni bazaga bitta yengil so'rov yuboradi, shunda ta'tilda ham loyiha uyg'oq turadi.
name: Supabase uyg'otgich
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bazaga murojaat
        run: |
          URL=$(grep -o "supabaseUrl: *'[^']*'" assets/js/config.js | sed "s/.*'\(.*\)'/\1/")
          KEY=$(grep -o "supabaseKey: *'[^']*'" assets/js/config.js | sed "s/.*'\(.*\)'/\1/")
          if [ -z "$URL" ]; then echo "config.js bo'sh (demo rejim), o'tkazib yuborildi"; exit 0; fi
          URL="${URL%/}"
          curl -sf -X POST "$URL/rest/v1/rpc/km_setup_status" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Baza uyg'oq"
